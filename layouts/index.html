{{ define "main" }}
<header>
    <img src="/dragon.jpg" alt="Logo">
    <nav>
        {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
    </nav>
</header>

<div class="dragon-hero">
    <h1 style="font-size: 4rem; text-transform: uppercase;">{{ .Title }}</h1>
</div>

<div class="content-area">
    {{ .Content }}
</div>

<footer style="background: #222; color: #fff; padding: 50px; text-align: center;">
    <p>© 2026 Dragon Brick - Authenticated LEGO Store</p>
</footer>
{{ end }}
