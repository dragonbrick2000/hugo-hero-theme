{{ define "main" }}
<header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <img src="/dragon.jpg" style="height: 50px; width: auto;" alt="Dragonbrick">
    <nav>
        {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}" style="margin-left: 25px; text-decoration: none; color: #333; font-weight: bold; text-transform: uppercase; font-size: 14px;">{{ .Name }}</a>
        {{ end }}
    </nav>
</header>

<div style="background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/Background.png'); background-size: cover; background-position: center; height: 500px; display: flex; align-items: center; justify-content: center; color: white; text-align: center;">
    <h1 style="font-size: 3.5rem; margin: 0;">{{ .Title }}</h1>
</div>

<div style="max-width: 900px; margin: 0 auto; padding: 80px 20px; line-height: 1.8; font-size: 1.1rem; text-align: justify;">
    {{ .Content }}
</div>

<footer style="background: #222; color: #fff; padding: 40px; text-align: center;">
    <p>© 2026 Dragon Brick - Ghép đam mê, xây giấc mơ</p>
</footer>
{{ end }}
