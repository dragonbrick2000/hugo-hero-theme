{{ define "main" }}
  <div class="dragon-hero" style="background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('/Background.png'); background-size: cover; background-position: center; height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center;">
    <h1 style="font-size: 3.5rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);">{{ .Title }}</h1>
    <p style="font-size: 1.5rem;">Ghép đam mê, xây giấc mơ</p>
  </div>

  <div style="max-width: 900px; margin: 0 auto; padding: 60px 20px; line-height: 1.8; font-size: 1.2rem; text-align: justify;">
    {{ .Content }}
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; background: #f4f4f4;">
    <div style="text-align: center; padding: 20px;">
      <h3>🧱 LEGO Chính Hãng</h3>
      <p>Cam kết 100% gạch LEGO từ Đan Mạch.</p>
    </div>
    <div style="text-align: center; padding: 20px;">
      <h3>🚀 Giao Hàng Nhanh</h3>
      <p>Ship hỏa tốc trong nội thành "Earth 616".</p>
    </div>
    <div style="text-align: center; padding: 20px;">
      <h3>💎 Giá Tốt Nhất</h3>
      <p>Luôn có ưu đãi cho các Builder tâm huyết.</p>
    </div>
  </div>
{{ end }}
