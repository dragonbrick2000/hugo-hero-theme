<div id="main-menu" class="main-menu nav-hint" style="display: block !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; width: 100% !important;">
    <ul style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; list-style: none !important; margin: 0 !important; padding: 10px 0 !important; width: max-content !important;">
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li style="display: block !important; flex-shrink: 0 !important;">
            <a href="{{ .URL | relURL }}" style="display: block !important; white-space: nowrap !important; color: #d40000 !important; font-weight: bold !important; text-decoration: none !important; padding: 8px 18px !important; border: 2px solid transparent !important; border-radius: 20px !important; font-size: 13px !important; transition: 0.3s !important;">
                {{ .Pre }}
                <span>{{ .Name }}</span>
            </a>
        </li>
        {{ end }}
    </ul>
</div>

<style>
    /* Hiệu ứng rung nhẹ báo hiệu vuốt được - Cưỡng chế chạy */
    .nav-hint { animation: hintSlide 1.5s ease-in-out !important; animation-delay: 1s !important; }
    @keyframes hintSlide {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-40px); }
        50% { transform: translateX(10px); }
    }
    /* Ẩn thanh cuộn cho đẹp */
    #main-menu::-webkit-scrollbar { display: none !important; }
</style>
