<nav class="nav-dragon-brick" style="display: block !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; flex-grow: 1 !important; margin-left: 15px !important; scrollbar-width: none !important;">
    <ul style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; width: max-content !important; gap: 10px !important; padding: 10px 0 !important; margin: 0 !important; list-style: none !important;">
        {{ range .Site.Menus.main }}
        <li>
            <a href="{{ .URL | relURL }}" style="display: block !important; white-space: nowrap !important; text-decoration: none !important; color: #d40000 !important; font-weight: bold !important; padding: 8px 18px !important; border: 2px solid #eee !important; border-radius: 25px !important; font-size: 12px !important; background: #fff !important; transition: 0.3s !important;">
                {{ .Name }}
            </a>
        </li>
        {{ end }}
    </ul>
</nav>

<style>
    .nav-dragon-brick::-webkit-scrollbar { display: none !important; }
    @media (max-width: 768px) {
        .nav-dragon-brick { animation: slideHint 2s ease-in-out !important; animation-delay: 1.5s !important; }
    }
    @keyframes slideHint {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-50px); }
        50% { transform: translateX(10px); }
    }
</style>
