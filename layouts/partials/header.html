<style>
/* ÉP CHẾ ĐỘ TRƯỜNG NGANG - KHÔNG CHO NHẢY DÒNG */
#main-menu.main-menu {
    display: block !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    scrollbar-width: none !important;
}
#main-menu.main-menu::-webkit-scrollbar { display: none !important; }

#main-menu.main-menu ul {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important; /* Cấm nhảy dòng tuyệt đối */
    width: max-content !important; /* Ép chiều dài theo tổng các nút */
    margin: 0 !important;
    padding: 10px 0 !important;
    list-style: none !important;
}

#main-menu.main-menu a {
    display: block !important;
    white-space: nowrap !important;
    color: #d40000 !important;
    font-weight: bold !important;
    text-decoration: none !important;
    padding: 8px 20px !important;
    border: 2px solid transparent !important;
    border-radius: 25px !important;
    font-size: 13px !important;
}

/* HIỆU ỨNG VẪY CHÀO */
@media (max-width: 768px) {
    .nav-hint {
        animation: hintSlide 2s ease-in-out !important;
        animation-delay: 1s !important;
    }
}
@keyframes hintSlide {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-70px); }
    50% { transform: translateX(15px); }
}
</style>
<div class='header header-absolute'>
  <div class="container">
    <div class="logo">
      <a href="{{ .Site.BaseURL }}"><img height={{ .Site.Params.logo.desktop_height }} width={{ .Site.Params.logo.desktop_width }} alt="{{ .Site.Params.logo.alt }}" src="{{ .Site.Params.logo.desktop | relURL }}" /></a>
    </div>
    <div class="logo-mobile">
      <a href="{{ .Site.BaseURL }}"><img height={{ .Site.Params.logo.mobile_height }} width={{ .Site.Params.logo.mobile_width }} alt="{{ .Site.Params.logo.alt }}" src="{{ .Site.Params.logo.mobile | relURL }}" /></a>
    </div>
    {{ partial "main-menu.html" . }}
    {{ partial "hamburger.html" . }}
  </div>
</div>
